name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a previous run of this workflow on the same branch/PR
# if a new commit is pushed, so we don't waste minutes on stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # `next build` type-checks the whole project on its own — it also
      # needs the route types Next.js generates during the build, so we
      # don't run `tsc --noEmit` as a separate step (it would fail on
      # `LayoutProps` before those types exist).
      - name: Build
        run: npm run build
